name: dependabot-automerge

# Labels a Dependabot PR "automerge" when it is a patch update or fixes an open
# security alert, then hands it to GitHub's native auto-merge, which lands it
# once the required checks pass.
#
# Setup, once, in the repository: turn on "Allow auto-merge" and add a branch
# protection rule (or ruleset) on main that names the required status checks.
# The osv-scanner check of a pull request is `osv-scanner (new in this PR)`:
# GitHub counts the skipped `osv-scanner` job as passing. The workflow creates
# the label `automerge` when the repository lacks it.
# With no required check, `gh pr merge --auto` merges at once instead of
# waiting (cli/cli#8514). A private repository on the GitHub Free plan cannot
# have branch protection: use ci-automerge-private there.
#
# Patch updates and open security alerts only. The `dependency-type` output of
# fetch-metadata is derived from dependency-group membership, so a package that
# a group re-lists is reported as `direct:development` even when it is also a
# production dependency, and it cannot gate minor updates.
#
# `pull_request_target` (not `pull_request`) is required: fetch-metadata and
# `gh pr merge` need a write-scoped token, and a Dependabot `pull_request` run
# gets a read-only token with no secrets. This workflow never checks out the
# code of the PR or runs anything from it; it reads the event payload and calls
# `gh`, so the elevated token is not exposed to untrusted input.

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers]

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # alert-lookup needs a token that reads the Dependabot alerts, which the
      # default GITHUB_TOKEN cannot. The token comes from a GitHub App with the
      # repository permissions "Dependabot alerts: read" and "Pull requests:
      # read", installed on this repository: its app ID in the variable
      # DEPENDABOT_APP_ID and its private key in the secret
      # DEPENDABOT_APP_PRIVATE_KEY, both at the level of the organization or of
      # the repository. A personal access token in the secret
      # DEPENDABOT_METADATA_TOKEN works as well. With neither, the job does not
      # look up alerts, and patch updates still merge. The input is `app-id`, not
      # `client-id`: actionlint 1.7.12 does not know `client-id`.
      - name: Create a token of the GitHub App
        id: app-token
        if: vars.DEPENDABOT_APP_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.DEPENDABOT_APP_ID }}
          private-key: ${{ secrets.DEPENDABOT_APP_PRIVATE_KEY }}
          permission-pull-requests: read
          permission-vulnerability-alerts: read

      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ steps.app-token.outputs.token || secrets.DEPENDABOT_METADATA_TOKEN || github.token }}
          alert-lookup: ${{ steps.app-token.outputs.token != '' || secrets.DEPENDABOT_METADATA_TOKEN != '' }}

      - name: Decide whether this update is "easy"
        id: gate
        env:
          ALERT_STATE: ${{ steps.metadata.outputs.alert-state }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          if [ "$ALERT_STATE" = "OPEN" ]; then
            reason="open security alert"
          elif [ "$UPDATE_TYPE" = "version-update:semver-patch" ]; then
            reason="patch update"
          else
            reason=""
          fi
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

      # Every `gh` call names --repo: this job has no checkout, so there is no
      # git remote for `gh` to read the repository from.
      - name: Label / unlabel and enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REASON: ${{ steps.gate.outputs.reason }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          if [ -n "$REASON" ]; then
            echo "Marking as auto-mergeable: $REASON"
            # `gh pr edit --add-label` fails when the label does not exist.
            gh label create automerge --repo "$REPO" --description "Dependabot update that merges on its own" || true
            gh pr edit "$PR_URL" --repo "$REPO" --add-label automerge
            # --auto queues the merge; GitHub completes it once the required
            # status checks go green. Calling it again on every push to the PR
            # (a Dependabot rebase) re-affirms the same request.
            gh pr merge "$PR_URL" --repo "$REPO" --auto --squash --delete-branch
          else
            echo "Not eligible for automerge: $UPDATE_TYPE"
            gh pr edit "$PR_URL" --repo "$REPO" --remove-label automerge || true
          fi
