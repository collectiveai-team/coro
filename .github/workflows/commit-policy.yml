name: commit-policy

# CES-91 on every commit of the pull request or of the push, which `git commit --no-verify` does
# not skip.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: commit-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  no-ai-coauthorship:
    name: no-ai-coauthorship
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.3"
          enable-cache: false

      - name: Read botica's version from uv.lock
        run: >-
          echo "BOTICA=$(uv export --frozen --no-hashes --no-header --no-annotate
          --only-group botica | grep -m1 '^botica==')" >> "$GITHUB_ENV"

      - name: Check commit messages
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # A push that creates the branch has no commit before it: its range is the whole history.
          range="$BASE_SHA..$HEAD_SHA"
          if [ -z "${BASE_SHA//0/}" ]; then
            range="$HEAD_SHA"
          fi
          uvx --from "$BOTICA" botica lint --select no-ai-coauthorship --commits "$range"
