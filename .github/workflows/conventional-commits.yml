name: Conventional Commits

# CES-75, on the title of the pull request, which a squash merge takes as the subject. The title is
# read from an env var (never interpolated into the shell) to avoid script injection.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: conventional-commits-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.3"
          enable-cache: false

      - name: Validate Conventional Commits format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: uvx botica@0.18.0 lint --select conventional-commits --pr-title="$PR_TITLE"
