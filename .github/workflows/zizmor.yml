name: zizmor

# Static analysis of GitHub Actions workflows and actions with zizmor.
# CI-only check: it is intentionally not wired into prek.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: zizmor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        # An exact tag: setup-uv publishes no major tag since v8.0.0.
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.3"
          enable-cache: true

      # --strict-collection: without it, an input that fails schema validation is
      # only WARNed about and then silently dropped from the audit, so a malformed
      # workflow is never scanned and the run still reports success.
      # Requires zizmor >= 1.7.0.
      #
      # GH_TOKEN puts zizmor in online mode so it can resolve referenced
      # actions (e.g. for the unpinned-uses audit). contents: read is enough.
      #
      # Pinned by the parameter zizmor-version of botica's recipe `ci`: new zizmor
      # releases add audits, and an unpinned zizmor would fail CI on every PR the
      # day one lands. Bump deliberately.
      - name: Run zizmor
        run: uvx zizmor@1.31.1 --strict-collection .
        env:
          GH_TOKEN: ${{ github.token }}
