[[repos]]
repo = "local"

[[repos.hooks]]
id = "promtool-check-metrics"
name = "promtool check metrics"
entry = "sh -c 'uv run --no-sync python scripts/export_metrics.py .tmp/metrics/metrics.prom && docker run --rm -i --entrypoint promtool prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2 check metrics < .tmp/metrics/metrics.prom'"
language = "system"
files = "^(coro/api/metrics\\.py|coro/app\\.py|coro/backends/asr/concurrency\\.py|scripts/export_metrics\\.py|uv\\.lock|prek\\.toml)$"
pass_filenames = false
priority = 2
