# MARK: uv-lock
[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "0.10.7"
hooks = [{ id = "uv-lock", priority = 0 }]

# MARK: pre-commit-hooks
[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"

# MARK: check-merge-conflict
[[repos.hooks]]
id = "check-merge-conflict"
priority = 0

# MARK: check-added-large-files
[[repos.hooks]]
id = "check-added-large-files"
args = ["--maxkb=750"]
exclude = "^uv\\.lock$"
priority = 0

# MARK: check-toml
[[repos.hooks]]
id = "check-toml"
priority = 0

# MARK: check-yaml
[[repos.hooks]]
id = "check-yaml"
args = ["--unsafe"]
priority = 0

# MARK: end-of-file-fixer
[[repos.hooks]]
id = "end-of-file-fixer"
priority = 0

# MARK: trailing-whitespace
[[repos.hooks]]
id = "trailing-whitespace"
priority = 0

# MARK: betterleaks
# Secret scanner (gitleaks fork). language = "golang" so prek builds it from the
# pinned tag in an isolated toolchain. Scans staged changes on commit; --redact
# keeps any matched secret out of the output.
[[repos]]
repo = "https://github.com/betterleaks/betterleaks"
rev = "v1.5.0"
hooks = [{ id = "betterleaks", priority = 0 }]

# MARK: validate-pyproject
[[repos]]
repo = "https://github.com/abravalheri/validate-pyproject"
rev = "v0.25"
hooks = [
    { id = "validate-pyproject", files = "^pyproject\\.toml$", priority = 0 },
]

# MARK: ruff-format
[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.15.4"

[[repos.hooks]]
id = "ruff-format"
priority = 0

# MARK: ruff-check
[[repos.hooks]]
id = "ruff"
args = ["--fix", "--exit-non-zero-on-fix"]
types_or = ["python", "pyi"]
require_serial = true
priority = 1

# MARK: pyrefly
# Run via `uv run` so the version pinned in the dev dependency-group (uv.lock)
# is used, and the root pyproject [tool.pyrefly] config is auto-detected.
[[repos]]
repo = "local"

[[repos.hooks]]
id = "pyrefly"
name = "pyrefly"
entry = "uv run pyrefly check coro/"
language = "system"
types = ["python"]
pass_filenames = false
priority = 2

# MARK: ast-grep
[[repos.hooks]]
id = "ast-grep"
name = "ast-grep"
entry = "uvx --from ast-grep-cli ast-grep scan"
language = "system"
types = ["python"]
pass_filenames = false
priority = 2

# MARK: falsegreen
# False-green test scanner: flags tests that pass without protecting anything
# (assertion-free, tautological, swallowed exception, mock typos, dead-code
# asserts). Pinned so a new upstream release cannot fail the build unannounced.
#
# Deliberately a local hook rather than the upstream remote one: upstream's
# entry hardcodes `falsegreen --staged`, which scans only git-staged files and
# therefore finds nothing in a clean CI checkout, making the gate silently
# vacuous. Scanning tests/ explicitly keeps `prek run --all-files` honest.
#
# --baseline records the findings that predate adoption, so only NEW findings
# fail. Config (severity tiers) lives in pyproject.toml [tool.falsegreen].
[[repos.hooks]]
id = "falsegreen"
name = "falsegreen"
entry = "uvx falsegreen==0.9.2 tests/ --baseline .falsegreen-baseline.json --summary"
language = "system"
types = ["python"]
pass_filenames = false
priority = 2

# MARK: adr-numbering
# Repo-layout checks live here rather than in tests/, which is the package's own
# suite: neither of the next two hooks imports coro or exercises any behaviour.
# They read the tree, so they are lint, and putting them in pytest made the suite
# fail for reasons that had nothing to do with the software.
#
# An ADR number is an identifier cited by number alone, so a duplicate makes every
# citation ambiguous. This has happened six times; nothing checked for it.
[[repos.hooks]]
id = "adr-numbering"
name = "adr numbering"
entry = "uv run python scripts/check_adr_numbering.py"
language = "system"
files = "^docs/adr/"
pass_filenames = false
priority = 2

# MARK: flicker-rule-rejected
# ADR 0014 dropped the sandwich rule after measuring it. This asserts both halves
# of that: the entry point may not be referenced outside its own module, its tests
# and that ADR, and the module recording the measurement must not be deleted. The
# script names the symbol; this comment deliberately does not, so the allow list
# stays as small as the invariant needs.
[[repos.hooks]]
id = "flicker-rule-rejected"
name = "flicker rule stays rejected"
entry = "uv run python scripts/check_flicker_rule_rejected.py"
language = "system"
types_or = ["python", "markdown"]
pass_filenames = false
priority = 2

# MARK: docker-check
# Lint the runtime Dockerfile with buildx's built-in checker (BuildKit rules).
# Uses the default cpu/ubuntu:noble build args; --check only parses, it does
# not build any layers. Runs only when the Dockerfile changes.
[[repos.hooks]]
id = "docker-check"
name = "docker-check"
entry = "docker buildx build --check ."
language = "system"
files = "^Dockerfile$"
pass_filenames = false
priority = 2
