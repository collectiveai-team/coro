# MARK: uv-lock
[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "0.10.7"
hooks = [{ id = "uv-lock", priority = 0 }]

# MARK: pre-commit-hooks
[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"

# MARK: check-merge-conflict
[[repos.hooks]]
id = "check-merge-conflict"
priority = 0

# MARK: check-added-large-files
[[repos.hooks]]
id = "check-added-large-files"
args = ["--maxkb=750"]
exclude = "^uv\\.lock$"
priority = 0

# MARK: check-toml
[[repos.hooks]]
id = "check-toml"
priority = 0

# MARK: check-yaml
[[repos.hooks]]
id = "check-yaml"
args = ["--unsafe"]
priority = 0

# MARK: end-of-file-fixer
[[repos.hooks]]
id = "end-of-file-fixer"
priority = 0

# MARK: trailing-whitespace
[[repos.hooks]]
id = "trailing-whitespace"
priority = 0

# MARK: betterleaks
# Secret scanner (gitleaks fork). language = "golang" so prek builds it from the
# pinned tag in an isolated toolchain. Scans staged changes on commit; --redact
# keeps any matched secret out of the output.
[[repos]]
repo = "https://github.com/betterleaks/betterleaks"
rev = "v1.5.0"
hooks = [{ id = "betterleaks", priority = 0 }]

# MARK: agents-conventional-commits
[[repos]]
repo = "local"

[[repos.hooks]]
id = "agents-conventional-commits"
name = "agents-conventional-commits (commit-msg)"
entry = "uvx botica@0.18.0 lint --select conventional-commits --commit-msg"
language = "system"
stages = ["commit-msg"]

# MARK: no-ai-coauthorship
[[repos.hooks]]
id = "no-ai-coauthorship"
name = "no-ai-coauthorship (commit-msg)"
entry = "uvx botica@0.18.0 lint --select no-ai-coauthorship --commit-msg"
language = "system"
stages = ["commit-msg"]

# MARK: jscpd
# The threshold sits just above the repository's 2.96% at adoption.
[[repos.hooks]]
id = "jscpd"
name = "jscpd (copy-paste duplication)"
entry = "npx --yes jscpd@5.4.2 . --threshold 3 --ignore \"**/uv.lock,**/poetry.lock,**/Pipfile.lock,**/package-lock.json,**/pnpm-lock.yaml,**/yarn.lock,**/bun.lock,**/bun.lockb,**/Cargo.lock,**/go.sum,**/composer.lock,**/Gemfile.lock\""
language = "system"
pass_filenames = false
priority = 2

# MARK: botica
[[repos]]
repo = "https://github.com/collectiveai-team/botica-pre-commit"
rev = "v0.18.0"

# Only the lines a commit adds fail; CI runs `--diff` instead, as `--all-files` stages nothing.
[[repos.hooks]]
id = "botica"
args = ["--staged"]
priority = 2

[[repos.hooks]]
id = "botica-project"
args = ["--staged"]
priority = 2

# Fix with `botica rules export --format agents-md --output AGENTS.md` and `--format abide`.
[[repos.hooks]]
id = "botica-agents-md"
priority = 2

[[repos.hooks]]
id = "botica-rubric"
priority = 2

# MARK: hadolint
# DL3008: Debian and Ubuntu drop old package versions from their archives,
# https://github.com/hadolint/hadolint/issues/884
[[repos]]
repo = "https://github.com/AleksaC/hadolint-py"
rev = "v2.15.1"
hooks = [{ id = "hadolint", args = ["--failure-threshold=warning", "--ignore=DL3008"], priority = 2 }]

# MARK: docker-compose-config
[[repos]]
repo = "local"

[[repos.hooks]]
id = "docker-compose-config"
name = "docker compose config"
entry = "sh -c 'status=0; for file do docker compose --file \"$file\" config --quiet --no-interpolate --no-env-resolution || status=1; done; exit $status' --"
language = "system"
files = '(^|/)(docker-)?compose[^/]*\.ya?ml$'
types = ["yaml"]
priority = 2

# MARK: validate-pyproject
[[repos]]
repo = "https://github.com/abravalheri/validate-pyproject"
rev = "v0.25"
hooks = [
    { id = "validate-pyproject", files = "^pyproject\\.toml$", priority = 0 },
]

# MARK: ruff-format
[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.15.4"

[[repos.hooks]]
id = "ruff-format"
priority = 0

# MARK: ruff-check
[[repos.hooks]]
id = "ruff"
args = ["--fix", "--exit-non-zero-on-fix"]
types_or = ["python", "pyi"]
require_serial = true
priority = 1

# MARK: pyrefly
# Run via `uv run` so the version pinned in the dev dependency-group (uv.lock)
# is used, and the root pyproject [tool.pyrefly] config is auto-detected.
[[repos]]
repo = "local"

[[repos.hooks]]
id = "pyrefly"
name = "pyrefly"
entry = "uv run --no-sync pyrefly check coro/"
language = "system"
types = ["python"]
pass_filenames = false
priority = 2

# MARK: deptry
# In the project's venv, not `uvx`: deptry maps import names through the installed packages.
[[repos.hooks]]
id = "deptry"
name = "deptry (unused/missing/misplaced dependencies)"
entry = "uv run --no-sync --with deptry==0.25.1 deptry ."
language = "system"
types_or = ["python", "toml"]
pass_filenames = false
priority = 2

# MARK: falsegreen
# False-green test scanner: flags tests that pass without protecting anything
# (assertion-free, tautological, swallowed exception, mock typos, dead-code
# asserts). Pinned so a new upstream release cannot fail the build unannounced.
#
# Deliberately a local hook rather than the upstream remote one: upstream's
# entry hardcodes `falsegreen --staged`, which scans only git-staged files and
# therefore finds nothing in a clean CI checkout, making the gate silently
# vacuous. Scanning tests/ explicitly keeps `prek run --all-files` honest.
#
# --baseline records the findings that predate adoption, so only NEW findings
# fail. Config (severity tiers) lives in pyproject.toml [tool.falsegreen].
[[repos.hooks]]
id = "falsegreen"
name = "falsegreen"
entry = "uvx falsegreen==0.9.2 tests/ --baseline .falsegreen-baseline.json --summary"
language = "system"
types = ["python"]
pass_filenames = false
priority = 2

# MARK: docker-check
# Lint the runtime Dockerfile with buildx's built-in checker (BuildKit rules).
# Uses the default cpu/ubuntu:noble build args; --check only parses, it does
# not build any layers. Runs only when the Dockerfile changes.
[[repos.hooks]]
id = "docker-check"
name = "docker-check"
entry = "docker buildx build --check ."
language = "system"
files = "^Dockerfile$"
pass_filenames = false
priority = 2
