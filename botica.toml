# "all": a new release's rules run in the bump's CI before it merges.
select = ["all"]
preview = true

[recipes]
installed = ["full-python", "python-test-smells", "agent-opencode", "agent-claude-code", "repo-public"]

[recipes.params]
ruff-adapters = "coro/backends/**"

[rules.file-size-guard]
extend-ignores = [
    "pyproject.toml",  # Configuration with one section per tool.
    "tests/bench/fixtures/md_eval/md-eval-22.pl",  # Vendored scorer fixture.
]

[rules.no-artifacts-in-package]
# The server warmup reads it at run time.
extend-ignores = ["coro/bench/data/jfk.wav"]
