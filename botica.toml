# Written by `botica recipe install`; `botica recipe check` compares it with the recipes.
select = [
  "file-size-guard",
  "no-notebooks",
  "no-artifacts-in-package",
  "no-utils",
  "lockfile-committed",
  "io-error",
  "unused-suppression",
  "invalid-suppression",
  "external-config",
  "botica-version-aligned",
  "conventional-commits",
  "no-ai-coauthorship",
  "dockerfile-lint",
  "compose-config",
  "no-tests-in-package",
  "no-dict-alias",
  "no-dict-call-return",
  "no-dict-literal-return",
  "no-dict-return-annotation",
  "api-schemas-extra-forbid",
  "log-get-logger",
  "log-no-print",
  "settings-module",
  "cli-typed-framework",
  "database-package",
  "import-layers",
  "settings-env-schema",
  "cognitive-complexity",
  "ruff-selection",
  "docstring-matches-signature",
  "pytest-strict",
  "test-no-subprocess",
  "test-no-network",
  "asyncio-no-get-event-loop",
  "uv-cooldown",
  "ruff-heavy-imports-in-function",
  "ruff-imports-at-top",
  "no-eager-heavy-imports",
  "dependabot-cooldown",
  "no-tautological-assert",
  "separate-orchestration",
  "architecture-vocabulary",
  "pr-small-by-intent",
  "respect-local-repo",
  "test-in-memory-adapters",
  "test-through-interface",
  "test-coverage-gap",
  "coverage-exclusion-reachable",
  "plain-writing",
  "minimal-comments",
  "ubiquitous-language",
]
preview = true
# Every other rule that applies here, so that `botica lint` without --diff is the full report.
extend-select = [
  "external-config-weakened",
  "recipe-conflict",
  "settings-base-class",
  "settings-direct-instantiation",
  "db-no-create-all",
  "api-schema-in-route-module",
  "api-request-schema-name",
  "api-response-schema-name",
  "route-auth",
  "jwt-verified",
  "short-lived-access-token",
  "no-coverage-pragma",
  "no-coverage-exclusion",
  "eager-test",
  "no-disabled-typecheck",
  "pyrefly-strict",
  "no-type-cast",
  "agents-md-refs-exist",
  # .botica/rules/coro
  "coro/api-docs-scalar-hardened",
  "coro/adr-numbering",
  "coro/flicker-rule-rejected",
]

[recipes]
installed = ["full-python", "python-test-smells", "agent-opencode", "agent-claude-code", "repo-public", "ci-botica-update"]

[recipes.params]
botica-version = "0.18.0"
ruff-adapters = "coro/backends/**"

[rules.file-size-guard]
# Generated by falsegreen; configuration with one section per tool.
extend-ignores = [".falsegreen-baseline.json", "pyproject.toml"]

[rules.no-artifacts-in-package]
# The server warmup reads it at run time.
extend-ignores = ["coro/bench/data/jfk.wav"]
