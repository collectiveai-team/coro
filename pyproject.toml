[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# Distribution name `coro` is taken on PyPI; publish as `coro-asr` while the
# import package stays `coro`. Version is derived from git tags (vX.Y.Z) via hatch-vcs.
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "coro/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["coro"]

[project]
name = "coro-asr"
dynamic = ["version"]
description = "Coro: OpenAI-compatible ASR + speaker-diarization server with pluggable backends."
# Rendered as the long description on the PyPI project page.
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12, <3.13"
authors = [
    { name = "collective.ai" },
    { name = "jedzill4", email = "raulonco@gmail.com" },
]
keywords = [
    "asr",
    "speech-to-text",
    "transcription",
    "speaker-diarization",
    "whisper",
    "openai-compatible",
    "fastapi",
]
# NB: with the SPDX `license` expression above, the legacy "License :: OSI
# Approved" trove classifier is intentionally omitted (PEP 639 / hatchling
# rejects declaring both).
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115.0",
    "faster-whisper>=1.2.0,<1.3.0",
    "lightning==2.4.0",
    "nemo-toolkit[asr]>=3.0.0,<3.1.0",
    # nemo-toolkit -> librosa -> numba (floor only, no numpy ceiling). On a fresh
    # resolution (uvx / uv tool install, which ignore uv.lock) uv picks the newest
    # numpy, finds no recent numba supports it, and backtracks numba down to 0.53.1
    # — a wheel that only builds on Python <3.10. Pin a numba floor that ships
    # py3.12 wheels so the backtrack can't reach the broken release.
    "numba>=0.61",
    "numpy>=1.26",
    # `coro run --server-url` uploads to an already-running server; imported
    # lazily, so it costs nothing on the in-process path.
    "httpx>=0.27.0",
    "onnx-asr[hub]>=0.11.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.27",
    # Renders the OpenAPI and AsyncAPI contracts from one /docs URL. Official
    # MIT integration published from the scalar/scalar org; the JS bundle it
    # loads is pinned and self-hosted (see coro/api/docs.py).
    "scalar-fastapi>=1.8.2",
    # Streaming resample for the Deepgram WebSocket: clients declare their own
    # sample_rate, the pipeline is fixed at 16 kHz.
    "soxr>=0.5",
    "uvicorn>=0.30.0",
    # WebSocket transport for POST-less /v1/listen; uvicorn ships none by default.
    "websockets>=13",
    "structlog>=25.1",
    "cyclopts>=4",
    "rich>=14",
    "pydantic>=2.7",
    "starlette>=0.40",
    "huggingface-hub>=0.24",
    "soundfile>=0.12",
    "typing-extensions>=4.13",
]

# Shown in the PyPI sidebar. The `Homepage`/`Source`/`Issues` keys map to the
# well-known icons; others render as plain links.
[project.urls]
Homepage = "https://github.com/collectiveai-team/coro"
Source = "https://github.com/collectiveai-team/coro"
Issues = "https://github.com/collectiveai-team/coro/issues"
Changelog = "https://github.com/collectiveai-team/coro/releases"


# onnxruntime and onnxruntime-genai each ship as two mutually-exclusive wheels (CPU vs GPU),
# so they are split across the existing cpu/cuda conflicting extras alongside torch.
# onnxruntime 1.24.1 is excluded for a known onnx-asr incompatibility.
# onnxruntime-genai powers the optional onnx-genai (nemotron streaming) backend.
# faster-whisper unconditionally requires `onnxruntime` (its Silero VAD); under the
# cuda extra that CPU wheel installs alongside onnxruntime-gpu and shadows the GPU
# build at import time. tool.uv.dependency-metadata (below) strips that dependency so
# the runtime is supplied solely by the selected extra (onnxruntime / onnxruntime-gpu).
[project.optional-dependencies]
cpu = [
    "torch>=2.12.1,<4.0",
    "torchaudio>=2.1.0,<4.0",
    "onnxruntime>=1.22,!=1.24.1",
    "onnxruntime-genai>=0.14.0",
]
cuda = [
    # CTranslate2 (faster-whisper) is still built against CUDA 12 cuBLAS; keep this
    # until it ships a CUDA 13 build (OpenNMT/CTranslate2#1933).
    "nvidia-cublas-cu12>=12.0.0.0",
    # torch (cu13) pins nvidia-cudnn-cu13 exactly. A second cuDNN from the cu12 wheel
    # lands in the same nvidia/cudnn dir and mixes sublibrary versions
    # (CUDNN_STATUS_SUBLIBRARY_VERSION_MISMATCH), so declare the cu13 wheel instead.
    "nvidia-cudnn-cu13>=9.0.0.0",
    "torch>=2.12.1,<4.0",
    "torchaudio>=2.1.0,<4.0",
    "onnxruntime-gpu!=1.24.1,>=1.27.0",
    "onnxruntime-genai-cuda>=0.14.0",
]
# Optional, gated batch-only diarization backend (pyannote community-1).
# Heavy dependency kept out of the core install; enable with `--extra diar-pyannote`.
diar-pyannote = [
    "pyannote.audio>=4.0",
]
# coro.recipes: reproducible ONNX export/quantization scripts that feed the
# comparative-reference ASR backends' artifact-directory contracts (see
# coro/recipes/__init__.py). Dev/export-time tooling, never imported by the
# server itself -- kept out of the core install with its own extra.
# `onnx` is already pulled in transitively today (nemo-toolkit -> onnx), but
# these recipes depend on it structurally (onnx.utils.extract_model,
# onnx.shape_inference), not incidentally, so it is declared directly here
# rather than relying on another package's transitive dependency to keep
# providing it. `pyarrow` powers coro.recipes.calibration_corpus's streaming
# Parquet reads via coro.bench.utils.hf_parquet (duplicated from the `bench`
# group, which is uv-only and not installable via pip extras).
recipes = [
    "onnx>=1.21.0",
    # Row-group-granular reads of the Hugging Face Parquet corpora behind the
    # Spanish Workload Set (coro/bench/utils/hf_parquet.py).
    "pyarrow>=17.0.0",
]

# Internal-only groups (PEP 735). Not exposed via pip; uv-native.
[dependency-groups]
dev = [
    "matplotlib>=3.11.0",
    "pandas>=3.0.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "anyio>=4.0.0",
    "openai>=2.0.0",
    "ruff>=0.15,<0.18",
    "pyrefly>=1.4,<2",
    "deepgram-sdk>=7.6.0",
    "pytest-timeout>=2.4",
    "pytest-randomly>=3.16",
    "pytest-socket>=0.7",
]
bench = [
    "kaldialign>=0.9",
    # Sliding-window language detection for coro/bench/language_drift.py's
    # four-signal drift metric (issue #64). Import name is `lingua`; was used
    # unconditionally by that module since its introduction (commit 9abf522)
    # but never actually declared here -- a gap this closes rather than
    # scope this session added.
    "lingua-language-detector>=2.0.0",
    "meeteval>=0.4.3",
    "nvidia-ml-py>=12.0.0",
    "pyarrow>=17.0.0",
    "regex>=2024.1",
    "rich>=15.0.0",
    "simplejson>=3.0.0",
]
# Everything needed to import coro.app and export the generated API contracts,
# and nothing else. `uv sync --only-group contracts` skips the project and the ML
# stack, so the CI breaking-change gate does not download ~2 GB of CUDA wheels
# just to serialise two JSON documents.
#
# Versions are deliberately unconstrained: uv resolves them from uv.lock, so the
# export runs against the same versions the app ships, while
# [project].dependencies stays the single place constraints are declared. If the
# app's module-import path ever grows a new dependency, the export fails loudly
# here with ModuleNotFoundError rather than drifting silently.
contracts = [
    "cyclopts",
    "fastapi",
    # The WebSocket route's PCM converter (coro/pcm.py) is imported when the app
    # is built, so exporting the contract now needs the resample stack. Both are
    # small wheels; the ~2 GB the group exists to avoid is torch/CUDA.
    "numpy",
    "pydantic-settings",
    "python-multipart",
    "scalar-fastapi",
    "soxr",
    "structlog",
]
botica = [
    "botica==0.18.1",
]

# MARK: uv
[tool.uv]
exclude-newer = "7 days"
# dependabot's own 7-day cooldown already gates botica; this lets uv lock what it proposes.
exclude-newer-package = { botica = false }
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]
default-groups = ["dev", "botica"]
# Security fixes past caps that nemo-toolkit 3.0.0 sets (hydra-core<=1.3.2) and that its
# lightning 2.4.0 sets (fsspec<2026). Lightning itself stays at 2.4.0: on 2.6 NeMo's
# nv-one-logger trainer fails to import (osv-scanner.toml). Re-check on each nemo release
# and drop the line it no longer needs. The wheel keeps nemo's caps.
override-dependencies = [
    "hydra-core>=1.3.6",
    "fsspec>=2026.6.0",
]
constraint-dependencies = ["transformers>=5.10"]

# Drop faster-whisper's unconditional `onnxruntime` dep so it does not pull the CPU
# wheel into the cuda resolution (where it would shadow onnxruntime-gpu). The runtime
# is provided by the cpu extra (onnxruntime) or cuda extra (onnxruntime-gpu). Mirrors
# faster-whisper 1.2.x base requires-dist minus onnxruntime; re-check on upgrade.
[[tool.uv.dependency-metadata]]
name = "faster-whisper"
requires-dist = [
    "ctranslate2<5,>=4.0",
    "huggingface-hub>=0.21",
    "tokenizers<1,>=0.13",
    "av>=11",
    "tqdm",
]

[tool.uv.sources]
torch = [{ index = "torch-cpu", extra = "cpu" }]
# pyannote.audio (diar-pyannote extra) pulls torchaudio; pin it to the same CPU
# index as torch so its native lib matches the installed torch ABI under --extra cpu.
torchaudio = [{ index = "torch-cpu", extra = "cpu" }]

[[tool.uv.index]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
coro = "coro.cli:main"
coro-bench = "coro.bench.cli:main"
coro-bench-diar = "coro.bench.eval_diarization_quality:main"

# MARK: Ruff
[tool.ruff]
line-length = 100
exclude = [
    # Generated by hatch-vcs at build time.
    "coro/_version.py",
    # Prototype dirs
    ".worktrees/",
    ".scratch/",
]

[tool.ruff.lint]
select = [
    "E", "F", "B", "SIM", "RET", "C4", "DTZ", "PTH", "LOG", "G", "S", "UP", "RUF", "FAST",
    "ERA001",
    "D",
    "ASYNC", "A", "BLE", "SLOT", "PLR0124", "PLR0133", "TID253", "DOC102", "DOC202", "DOC403",
]
ignore = ["D1"]
preview = true
explicit-preview-rules = true
task-tags = ["TODO", "FIXME", "XXX", "MARK"]
external = ["BT"]

[tool.ruff.lint.flake8-tidy-imports]
banned-module-level-imports = ["torch", "tensorflow", "jax", "transformers", "cv2"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "S108", "S106", "TID253"]
"coro/backends/**" = ["TID253"]
# FastAPI routes use the idiomatic `= File(...)` / `= Form(...)` / `= Query(...)`
# default style.
"coro/api/openai/transcriptions.py" = ["FAST002", "B008"]
"coro/api/deepgram/listen.py" = ["FAST002", "B008"]
"coro/bench/report_markdown.py" = ["E501"]
"coro/bench/run.py" = ["PTH123", "SIM105"]
"coro/bench/server_lifecycle.py" = ["S603", "S607", "S310"]
"coro/bench/transport.py" = ["S310"]
# Downloads the AMI corpus over http(s) from a fixed mirror.
"coro/bench/utils/ami_audios_download.py" = ["S310"]
"coro/bench/utils/audio_clips.py" = ["S603", "S607"]
# Fetches public corpora over https from the Hugging Face Parquet index.
"coro/bench/utils/hf_parquet.py" = ["S310"]
# Clip utilities shell out to the system ffmpeg binary by name.
"coro/bench/utils/make_ami_clip.py" = ["S603", "S607"]
# Mirrors coro/bench/run.py: the sampler's tests must spawn a real process tree
# (`sh`, and `pgrep` as the reference implementation) to have anything to walk.
"tests/bench/test_bench_run.py" = ["S603", "S607"]
# Builds a WebM with the system ffmpeg and reads it back with ffprobe, by name:
# container handling is what is under test, so a mock would only restate it.
"tests/test_audio_probe.py" = ["S603", "S607"]
"coro/settings/server.py" = ["S104"]


# MARK: Pyrefly
[tool.pyrefly]
# Scope checking to first-party sources. Without this, a bare `pyrefly check`
# (e.g. from the prek hook or CI) walks the whole tree incl. site-packages.
project-includes = ["coro", "tests"]
project-excludes = [
    "**/node_modules",
    "**/__pycache__",
    "**/venv/**/*",
    "**/.venv/**/*",
    "**/.uv_cache/**/*",
    # Generated by hatch-vcs at build time.
    "coro/_version.py",
    # Prototype scripts — excluded from active verification per PRD.
    "custom_server.py",
    "custom_server_chunked.py",
    "run_transcription.py",
    "custom_client.py",
    "tools/**",
    ".worktrees/**",
    ".scratch/**",
    "test_batch_diarization.py",
    "test_no_overlap.py",
]
use-ignore-files = false
disable-project-excludes-heuristics = true
python-interpreter-path = ".venv/bin/python"
# onnxruntime_genai is a compiled extension shipping no type stubs; treat its
# attributes as Any rather than reporting every og.* access as missing.
# pyannote.audio is an optional, gated diarization backend behind the
# `diar-pyannote` extra; it is not installed in the default (or CI) env, so
# treat its lazy import as Any rather than reporting a missing module.
replace-imports-with-any = ["onnxruntime_genai", "pyannote.audio"]
preset = "strict"
required-version = ">=1.4,<2"

[tool.pyrefly.errors]
explicit-any = true
missing-attribute-patch-target = "error"
unused-coroutine = "error"

[[tool.pyrefly.sub-config]]
matches = "tests/**"

[tool.pyrefly.sub-config.errors]
implicit-any-parameter = false


# MARK: Pytest
[tool.pytest.ini_options]
minversion = "9.0"
asyncio_mode = "auto"
testpaths = ["tests"]
# Makes the `support` helper package importable from every directory of the tree.
pythonpath = ["tests"]
addopts = ["-ra", "--disable-socket", "--allow-unix-socket"]
strict_config = true
strict_markers = true
strict_xfail = true
strict_parametrization_ids = true
empty_parameter_set_mark = "fail_at_collect"
required_plugins = ["pytest-asyncio", "pytest-socket", "pytest-timeout"]
timeout = 60
session_timeout = 900
markers = [
  "unit: fast isolated tests, no external deps",
  "integration: tests requiring external services or multi-component interaction",
  "e2e: end-to-end smoke tests",
  "real_model: loads real model checkpoints; runs only with CORO_RUN_REAL_MODEL_TESTS=1, with the network",
]


# MARK: falsegreen
# False-green test scanner: flags tests that pass without protecting anything.
# Exit contract is 0 clean / 10 low-only / 20 high. The prek hook runs it with
# no baseline, so any finding fails the build.
# MARK: Falsegreen
[tool.falsegreen]

# The diagnostic tier is off by default upstream; opt in only where the signal
# is worth the noise. "info" findings never affect the exit code.
# D1 (Assertion Roulette, 182 hits) and D5 (Inline Setup Excess, 51 hits) are
# deliberately left off: both are readability nits rather than ways a test stays
# green while broken, and at that volume they bury the findings that matter.
[tool.falsegreen.severity]
D3 = "info" # Duplicate Assert
D6 = "info" # Debug Print left in a test
M2 = "info" # Long Test Method


# MARK: deptry
[tool.deptry]
known_first_party = ["coro"]
extend_exclude = [
    "\\.botica",
    "\\.tmp",
    "\\.scratch",
    "\\.worktrees",
    "scripts",
    "notebooks",
    "benchmark",
    "backup",
    "resources",
]

[tool.deptry.package_module_name_map]
"pyannote.audio" = "pyannote"

[tool.deptry.per_rule_ignores]
# Declared, never imported: torchaudio (torch's index), python-multipart (FastAPI forms),
# websockets (uvicorn), numba and lightning (resolver pins), GPU runtimes and libraries.
DEP002 = [
    "torchaudio",
    "python-multipart",
    "websockets",
    "numba",
    "lightning",
    "onnxruntime-gpu",
    "onnxruntime-genai-cuda",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu13",
]
DEP004 = ["meeteval", "lingua", "pynvml", "kaldialign", "regex"]
