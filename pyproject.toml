[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# PyPI name `coro-asr` (`coro` is taken); the version comes from git tags (hatch-vcs).
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "coro/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["coro"]

[project]
name = "coro-asr"
dynamic = ["version"]
description = "Coro: OpenAI-compatible ASR + speaker-diarization server with pluggable backends."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12, <3.13"
authors = [
    { name = "collective.ai" },
    { name = "jedzill4", email = "raulonco@gmail.com" },
]
keywords = [
    "asr",
    "speech-to-text",
    "transcription",
    "speaker-diarization",
    "whisper",
    "openai-compatible",
    "fastapi",
]
# No OSI trove classifier: PEP 639 forbids it beside an SPDX `license`.
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115.0",
    "faster-whisper>=1.2.0,<1.3.0",
    "lightning==2.4.0",
    "nemo-toolkit[asr]>=3.0.0,<3.1.0",
    # A floor with py3.12 wheels; a fresh resolve (uvx) otherwise backtracks to 0.53.1.
    "numba>=0.61",
    "numpy>=1.26",
    "httpx>=0.27.0",
    "onnx-asr[hub]>=0.11.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.27",
    "scalar-fastapi>=1.8.2",
    "soxr>=0.5",
    "uvicorn>=0.30.0",
    "websockets>=13",
    "structlog>=25.1",
    "cyclopts>=4",
    "rich>=14",
    "pydantic>=2.7",
    "starlette>=0.40",
    "huggingface-hub>=0.24",
    "soundfile>=0.12",
    "typing-extensions>=4.13",
]

[project.urls]
Homepage = "https://github.com/collectiveai-team/coro"
Source = "https://github.com/collectiveai-team/coro"
Issues = "https://github.com/collectiveai-team/coro/issues"
Changelog = "https://github.com/collectiveai-team/coro/releases"


# onnxruntime and onnxruntime-genai ship CPU and GPU wheels, split across the conflicting
# cpu/cuda extras. 1.24.1 breaks onnx-asr. faster-whisper's own onnxruntime is stripped
# below ([[tool.uv.dependency-metadata]]).
[project.optional-dependencies]
cpu = [
    "torch>=2.12.1,<4.0",
    "torchaudio>=2.1.0,<4.0",
    "onnxruntime>=1.22,!=1.24.1",
    "onnxruntime-genai>=0.14.0",
]
cuda = [
    # CTranslate2 still needs CUDA 12 cuBLAS (OpenNMT/CTranslate2#1933).
    "nvidia-cublas-cu12>=12.0.0.0",
    # torch cu13 pins cudnn-cu13; a cu12 cuDNN beside it mixes sublibrary versions.
    "nvidia-cudnn-cu13>=9.0.0.0",
    "torch>=2.12.1,<4.0",
    "torchaudio>=2.1.0,<4.0",
    "onnxruntime-gpu!=1.24.1,>=1.27.0",
    "onnxruntime-genai-cuda>=0.14.0",
]
diar-pyannote = [
    "pyannote.audio>=4.0",
]
# ONNX export/quantization scripts (coro/recipes), never imported by the server.
# pyarrow repeats the bench group, which pip cannot install.
recipes = [
    "onnx>=1.21.0",
    "pyarrow>=17.0.0",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.0",
    "pandas>=3.0.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "anyio>=4.0.0",
    "openai>=2.0.0",
    "ruff>=0.15,<0.18",
    "pyrefly>=1.4,<2",
    "deepgram-sdk>=7.6.0",
    "pytest-timeout>=2.4",
    "pytest-randomly>=3.16",
    "pytest-socket>=0.7",
]
bench = [
    "kaldialign>=0.9",
    "lingua-language-detector>=2.0.0",
    "meeteval>=0.4.3",
    "nvidia-ml-py>=12.0.0",
    "pyarrow>=17.0.0",
    "regex>=2024.1",
    "rich>=15.0.0",
    "simplejson>=3.0.0",
]
# Enough to import coro.app and export the API contracts in CI without the ML stack.
# Unconstrained: the versions come from uv.lock.
contracts = [
    "fastapi",
    "numpy",
    "pydantic-settings",
    "python-multipart",
    "scalar-fastapi",
    "soxr",
]

# MARK: uv
[tool.uv]
exclude-newer = "7 days"
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]
default-groups = ["dev"]

# faster-whisper's requires-dist without onnxruntime, whose CPU wheel would shadow
# onnxruntime-gpu. Mirrors faster-whisper 1.2.x; re-check on upgrade.
[[tool.uv.dependency-metadata]]
name = "faster-whisper"
requires-dist = [
    "ctranslate2<5,>=4.0",
    "huggingface-hub>=0.21",
    "tokenizers<1,>=0.13",
    "av>=11",
    "tqdm",
]

[tool.uv.sources]
torch = [{ index = "torch-cpu", extra = "cpu" }]
# torchaudio from torch's CPU index, so its native library matches torch.
torchaudio = [{ index = "torch-cpu", extra = "cpu" }]

[[tool.uv.index]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
coro = "coro.cli:main"
coro-bench = "coro.bench.cli:main"
coro-bench-diar = "coro.bench.eval_diarization_quality:main"

# MARK: Ruff
[tool.ruff]
line-length = 100
exclude = [
    "coro/_version.py",
    ".worktrees/",
    ".scratch/",
]

[tool.ruff.lint]
select = [
    "E", "F", "B", "SIM", "RET", "C4", "DTZ", "PTH", "LOG", "G", "S", "UP", "RUF", "FAST",
    "ERA001",
    "D",
    "ASYNC", "A", "BLE", "SLOT", "PLR0124", "PLR0133", "TID253", "DOC102", "DOC202", "DOC403",
]
ignore = ["D1"]
# The DOC codes are preview rules; only the ones named in full turn on.
preview = true
explicit-preview-rules = true
task-tags = ["TODO", "FIXME", "XXX", "MARK"]
# botica's `# noqa: BTxxx` codes (RUF102 otherwise).
external = ["BT"]

[tool.ruff.lint.flake8-tidy-imports]
banned-module-level-imports = ["torch", "tensorflow", "jax", "transformers", "cv2"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "S108", "S106", "TID253"]
# Adapters exist to use a heavy library, so they import it at the top.
"coro/backends/**" = ["TID253"]
"coro/api/openai/transcriptions.py" = ["FAST002", "B008"]
"coro/api/deepgram/listen.py" = ["FAST002", "B008"]
"coro/bench/report_markdown.py" = ["E501"]
# Bench tooling runs system tools by name (ffmpeg, pgrep), reads /proc and fetches public corpora.
"coro/bench/run.py" = ["PTH123", "SIM105"]
"coro/bench/server_lifecycle.py" = ["S603", "S607", "S310"]
"coro/bench/transport.py" = ["S310"]
"coro/bench/utils/ami_audios_download.py" = ["S310"]
"coro/bench/utils/audio_clips.py" = ["S603", "S607"]
"coro/bench/utils/hf_parquet.py" = ["S310"]
"coro/bench/utils/make_ami_clip.py" = ["S603", "S607"]
"tests/bench/test_bench_run.py" = ["S603", "S607"]
"tests/test_audio_probe.py" = ["S603", "S607"]
"coro/settings/server.py" = ["S104"]


# MARK: Pyrefly
[tool.pyrefly]
# Without it, `pyrefly check` walks site-packages too.
project-includes = ["coro", "tests"]
project-excludes = [
    "**/node_modules",
    "**/__pycache__",
    "**/venv/**/*",
    "**/.venv/**/*",
    "**/.uv_cache/**/*",
    "coro/_version.py",
    "custom_server.py",
    "custom_server_chunked.py",
    "run_transcription.py",
    "custom_client.py",
    "tools/**",
    ".worktrees/**",
    ".scratch/**",
    "test_batch_diarization.py",
    "test_no_overlap.py",
]
use-ignore-files = false
disable-project-excludes-heuristics = true
python-interpreter-path = ".venv/bin/python"
# No stubs (onnxruntime_genai), or not installed by default (pyannote.audio).
replace-imports-with-any = ["onnxruntime_genai", "pyannote.audio"]
preset = "strict"
required-version = ">=1.4,<2"

[tool.pyrefly.errors]
explicit-any = true
missing-attribute-patch-target = "error"
unused-coroutine = "error"

[[tool.pyrefly.sub-config]]
matches = "tests/**"

[tool.pyrefly.sub-config.errors]
implicit-any-parameter = false


# MARK: Pytest
[tool.pytest.ini_options]
# pytest 8 does not know the strict_* keys; minversion stops it.
minversion = "9.0"
asyncio_mode = "auto"
testpaths = ["tests"]
# Makes the `support` helper package importable from every directory of the tree.
pythonpath = ["tests"]
# Sockets are off unless a test is integration/e2e (tests/conftest.py) or allow_hosts.
addopts = ["-ra", "--disable-socket", "--allow-unix-socket"]
strict_config = true
strict_markers = true
strict_xfail = true
strict_parametrization_ids = true
empty_parameter_set_mark = "fail_at_collect"
required_plugins = ["pytest-asyncio", "pytest-socket", "pytest-timeout"]
timeout = 60
session_timeout = 900
markers = [
  "unit: fast isolated tests, no external deps",
  "integration: tests requiring external services or multi-component interaction",
  "e2e: end-to-end smoke tests",
]


# MARK: Falsegreen
# .falsegreen-baseline.json holds the findings that predate adoption; only new ones fail.
# Never regenerate it to silence a new finding.
[tool.falsegreen]

# D1 and D5 stay off: readability nits that would bury the findings that matter.
[tool.falsegreen.severity]
D3 = "info" # Duplicate Assert
D6 = "info" # Debug Print left in a test
M2 = "info" # Long Test Method


# MARK: deptry
[tool.deptry]
known_first_party = ["coro"]
extend_exclude = [
    "\\.botica",
    "\\.tmp",
    "\\.scratch",
    "\\.worktrees",
    "scripts",
    "notebooks",
    "benchmark",
    "backup",
    "resources",
]

[tool.deptry.package_module_name_map]
"pyannote.audio" = "pyannote"

[tool.deptry.per_rule_ignores]
# Declared, never imported: torchaudio (torch's index), python-multipart (FastAPI forms),
# websockets (uvicorn), numba and lightning (resolver pins), GPU runtimes and libraries.
DEP002 = [
    "torchaudio",
    "python-multipart",
    "websockets",
    "numba",
    "lightning",
    "onnxruntime-gpu",
    "onnxruntime-genai-cuda",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu13",
]
DEP004 = ["meeteval", "lingua", "pynvml", "kaldialign", "regex"]
